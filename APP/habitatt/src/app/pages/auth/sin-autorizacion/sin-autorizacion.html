<main class="unauthorized-page">
    <section class="unauthorized-container">
        <mat-card class="unauthorized-card" appearance="outlined">
            <mat-card-content>
                <div>
                    <p></p>
                    <h1>Acceso no autorizado</h1>
                    <p></p>
                    <img src="/pad.gif" style="width: 150px; height: auto;" alt="Locked..." />
                </div>
                <h2 class="description">La cuenta actual no tiene autorización para acceder a esta parte de la aplicación. </h2>
                <mat-divider></mat-divider>
                <div class="information-box">
                    <div>
                        <strong>¿Por qué aparece este mensaje?</strong>
                        <p> La página solicitada está restringida según el rol asignado al usuario autenticado. </p>
                    </div>
                </div>
                <div class="actions">
                    <button mat-flat-button type="button" class="primary-action" (click)="irAlInicio()">
                        <mat-icon>home</mat-icon> Inicio </button>
                </div>
            </mat-card-content>
        </mat-card>
    </section>
</main>
