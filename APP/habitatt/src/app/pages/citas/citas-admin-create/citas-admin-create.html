<section class="page-container">
    <header class="page-header"> <h1>Crear nueva cita</h1> </header>
    @if (loading()) {
        <p>Cargando datos para el formulario...</p>
    } @else {
        @if (error()) { <p class="error-message"> {{ error() }} </p> }
        <app-citas-form
            [saving]="saving()"
            (guardar)="guardar($event)"
            (cancelar)="cancelar()"
        />
    }
</section>
