 <section class="page-container">
    <header class="page-header"> <h1>Alterar datos de Profesional</h1></header>

    @if (loading()) {
        <p>Cargando información del profesional...</p>
    } @else {
        @if (error()) {<p class="error-message">{{ error() }}</p>}
        @if (profesional()) {
            <app-profesionales-form
                [profesional]="profesional()"
                [saving]="saving()"
                (guardar)="guardar($event)"
                (cancelar)="cancelar()"
            />
        }
    }
</section>
