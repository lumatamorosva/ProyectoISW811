<section class="hero glass-card">
    <div class="hero-content">
        <h1 align="center"> De punta a punta </h1>
        <h2> Te ofrecemos servicios que te acompañan desde la idea hasta el último detalle para que hagas tu sueño realidad con tranquilidad</h2>
    </div>
    <div class="hero-visual">
        <mat-icon>add_home_work</mat-icon>
    </div>
</section>
<section class="hero-image-container"><img class="img1" src="home.jpg" alt="fachada"></section>
<section class="summary-grid">
    @for (card of visibleCards(); track card.link) {
    <mat-card [routerLink]="card.link" class="dashboard-card glass-card">
        <mat-card-header>
            <div class="card-icon "> <mat-icon>{{ card.icon }}</mat-icon> </div> <h2>{{ card.title }}</h2>
        </mat-card-header>
        <mat-card-content> <p>{{ card.description }}</p> </mat-card-content>
    </mat-card>
    }
</section>
